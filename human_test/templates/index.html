<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Test</title>

</head>
<body>
    <h1></h1>
    
    <div class="upload-container">
        <h2>上传JSON</h2>
        <div class="file-input-wrapper">
            <input type="file" id="jsonFileInput" accept=".json" />
        </div>
        <div class="file-input-wrapper">
            <span style="font-size: 13px;">或使用本地相对路径 (PYTHONPATH=./human_test_code/)</span>
            <input style="font-size: 13px;" type="text" id="localdir" placeholder="xxx"/>
            <button id="uselocal" style="font-size: 12px;">提交</button>
        </div>
    </div>
    
    <div class="container">
        <div style="flex: 1; min-width: 400px;">
            <h2>TRAIN</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">input_1</div>
                        <div class="matrices-container" id="input_1"></div>
                    </td>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">output_1</div>
                        <div class="matrices-container" id="output_1"></div>
                    </td>
                </tr>
            
                <tr>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">input_2</div>
                        <div class="matrices-container" id="input_2"></div>
                    </td>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">output_2</div>
                        <div class="matrices-container" id="output_2"></div>
                    </td>
                </tr>
                <tr>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">input_3</div>
                        <div class="matrices-container" id="input_3"></div>
                    </td>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">output_3</div>
                        <div class="matrices-container" id="output_3"></div>
                    </td>
                </tr>
            </table>
        </div>
        
        <div style="flex: 1; min-width: 400px;">
            <h2>TEST</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">test_input</div>
                        <div class="matrices-container" id="test_input"></div>
                    </td>
                    <td style="width: 50%; padding: 10px; border: 1px solid #ddd; vertical-align: top;">
                        <div style="margin-bottom: 5px; font-weight: bold;">
                            <span id="test_output_span">test_output</span>
                            <span id="submitStatus" style="font-size: 20px; vertical-align: middle; color: gray;">&#10003;</span>
                        </div>
                        <div class="matrices-container" id="test_output"></div>
                    </td>
                </tr>
            </table>
        </div>
        <div style="display: flex;  gap: 20px; margin: 20px auto 0; width: fit-content;">
            <button id="preBtn" style="padding: 8px 20px; font-size: 16px;">Previous</button>
            <button id="nextBtn" style="padding: 8px 20px; font-size: 16px;">Next</button>
            <button id="finalSubmit" style="padding: 8px 20px; font-size: 16px;">Submit</button>
        </div>
        <div style="display: flex;  gap: 10px; margin: 5px auto 0; width: fit-content;">
            <h4 id="todo-list"></h4>
            <h4 id="score"></h4>
        </div>
    </div>

    <script>
        const jsonFileInput = document.getElementById('jsonFileInput');
        const nextBtn = document.getElementById('nextBtn')
        const preBtn = document.getElementById('preBtn');
        const submitBtn = document.getElementById('submitBtn');
        const submitStatus = document.getElementById('submitStatus');
        const finalSubmit = document.getElementById('finalSubmit');
        const todoList = document.getElementById('todo-list');
        const uselocal = document.getElementById('uselocal');

        let metaData = null;
        let currentIndex = 0;
        let filename = null;



        function updatetodolist(data) {
            string = '未做：'
            for (let i = 0; i < data.length; i++) {
                if (!data[i].test[0].human) {
                    string += `${i} `;
                }
            }
            todoList.innerHTML = string;
            todoList.style.color = 'red'
        }
        function are2DArraysEqual(arr1, arr2) {
            if (arr1.length !== arr2.length) return false;
            for (let i = 0; i < arr1.length; i++) {
                if (arr1[i].length !== arr2[i].length) return false;
                for (let j = 0; j < arr1[i].length; j++) {
                    if (arr1[i][j] !== arr2[i][j]) return false;
                }
            }
            return true;
        }
        finalSubmit.addEventListener('click', function() {
            updatehuman();
            updatetodolist(metaData);
            updateMatrices(metaData, currentIndex);
            if (metaData) {
                let successcnt = 0;
                for (let i = 0; i < metaData.length; i++) {
                    if (metaData[i].test[0].human && are2DArraysEqual(metaData[i].test[0].human, metaData[i].test[0].output)){
                        successcnt++;
                    }
                }
                metaData.humanscore = successcnt / metaData.length * 100;
                const formData = new FormData();
                formData.append('metaData', JSON.stringify(metaData));
                formData.append('filename', filename || '');
                fetch('/submit', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showscore(data.filepath, metaData.humanscore);
                    } else {
                        alert('提交失败: ' + data.message);
                    }
                })
                .catch(error => {
                    alert('提交失败: ' + error.message);
                });
            }
        });

        function showscore(filepath, humanscore) {
            const score = document.getElementById('score');
            score.style.color = 'green';
            score.innerHTML = '';
            if (humanscore != null && filepath) {
                score.innerHTML = `文件保存在 ${filepath}，分数为：${humanscore}`;
            } else {
                score.innerHTML = '';
            }
        }
        jsonFileInput.addEventListener('change', function(event) {
            const score = document.getElementById('score');
            score.innerHTML = '';
            
            const file = event.target.files[0];
            filename = file.name
            if (file && file.type === 'application/json') {
                const formData = new FormData();
                formData.append('file', file);

                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    metaData = data.data;
                    currentIndex = 0
                    updateMatrices(metaData, 0);
                    updatetodolist(metaData);
                    showscore(null, null);
                })
                .catch(error => {
                    showMessage('上传或解析JSON失败: ' + error.message);
                });
            } else {
                showMessage('请选择一个有效的JSON文件');
            }
        });
        uselocal.addEventListener('click', function() {
            const localdir = document.getElementById('localdir').value;
            if (localdir) {
                fetch('/uselocal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 'localdir': localdir })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        metaData = data.data;
                        currentIndex = 0;
                        updateMatrices(metaData, 0);
                        updatetodolist(metaData);
                        showscore(null, null);
                        localdir.value = 0;
                    } else {
                        alert('data 提交失败: ' + data.message);
                    }
                })
                .catch(error => {
                    alert('error 提交失败: ' + error.message);
                });
            } else {
                alert('请输入本地路径');
            }
        });
        function updatehuman() {
            const testOutputContainer = document.getElementById('test_output');
            const humanInput = getHumanInputFromTable(testOutputContainer);
            metaData[currentIndex].test[0].human = humanInput;
        }
        nextBtn.addEventListener('click', function() {
            // Move to next index if possible
            if (currentIndex < metaData.length - 1) {
                updatehuman();
                updatetodolist(metaData);
                currentIndex++;
                updateMatrices(metaData, currentIndex);
            } else {
                alert('已经是最后一个了');
            }
        });
        preBtn.addEventListener('click', function() {
            // Move to next index if possible
            if (currentIndex > 0) {
                currentIndex--;
                updateMatrices(metaData, currentIndex);
            } else {
                alert('这是第一个');
            }
        });
        function getHumanInputFromTable(container) {
            const table = container.querySelector('table');
            if (!table) return null;
            const result = [];
            for (let i = 1; i < table.rows.length; i++) {
                const row = [];
                for (let j = 1; j < table.rows[i].cells.length; j++) {
                    const input = table.rows[i].cells[j].querySelector('input');
                    row.push(input ? Number(input.value) : 0);
                }
                result.push(row);
            }
            return result;
        }
        function updateMatrices(matricesData, index) {
            // 遍历每个矩阵数据对
            for (let i = 0; i < 3; i++) {
                const inputData = matricesData[index].train[i].input;
                const outputData = matricesData[index].train[i].output;
                const inputContainer = document.getElementById(`input_${i + 1}`);
                const outputContainer = document.getElementById(`output_${i + 1}`);
                if (!inputContainer || !outputContainer) {
                    console.error(`Container elements not found for pair ${i + 1}`);
                    continue;
                }
                renderMatrix(inputContainer, inputData);
                renderMatrix(outputContainer, outputData);
            }
            const testInputData = matricesData[index].test[0].input;
            const testOutputData = matricesData[index].test[0].output;
            const human = matricesData[index].test[0].human;
            

            const testInputContainer = document.getElementById('test_input');
            const testOutputContainer = document.getElementById('test_output');
            renderMatrix(testInputContainer, testInputData);
            showhumanMatrix(testOutputContainer, human, testInputData, testOutputData);

            const testoutputspan = document.getElementById('test_output_span');
            testoutputspan.innerHTML = `test_output (${index})`
        }

        document.getElementById('test_output').addEventListener('input', function(e) {
            if (metaData[currentIndex].test[0].input.length != metaData[currentIndex].test[0].output.length) {
                return;
            }
            const eid = e.target.id;
            const match = eid.match(/humantable_(\d+)_(\d+)/);
            if (match) {
                const i = parseInt(match[1]);
                const j = parseInt(match[2]);
                const inputValue = Number(e.target.value);
                if (metaData[currentIndex].test[0].input[i][j] != inputValue) {
                    e.target.style.color = 'blue';
                    e.target.style.fontWeight = 'bold';
                } else {
                    e.target.style.color = 'black';
                    e.target.style.fontWeight = 'normal';
                }
            }
        });
        function showhumanMatrix(container, human, inputdata, outputdata) {
            if (!container || !outputdata) {
                console.error('Invalid container or matrix data');
                return;
            }
            container.innerHTML = '';
            if (human) {
                submitStatus.style.color = 'green';
                document.getElementById('test_output_span').style.color = 'green';
            } else {
                submitStatus.style.color = 'gray';
                document.getElementById('test_output_span').style.color = 'gray';
            }
            const headerRow = document.createElement('tr');
            const cornerCell = document.createElement('th');
            cornerCell.style.border = '1px solid #ddd';
            cornerCell.style.padding = '2px';
            cornerCell.style.fontFamily = 'monospace';
            headerRow.appendChild(cornerCell);
            if (!human) {
                // human为空，创建与matrixData同规格、初值为0的可输入表格
                const table = document.createElement('table');
                table.style.borderSpacing = '0'; 
                table.style.tableLayout = 'fixed'; 
                table.style.borderCollapse = 'collapse';
                const rowLength = outputdata[0].length
                for (let colIndex = 0; colIndex < rowLength; colIndex++) {
                    const th = document.createElement('th');
                    th.textContent = colIndex + 1;
                    th.style.fontSize = '0.8em';
                    th.style.color = '#666';
                    th.style.border = '1px solid #ddd';
                    th.style.padding = '2px';
                    th.style.fontFamily = 'monospace';
                    headerRow.appendChild(th);
                }
                table.appendChild(headerRow);
                if (inputdata.length == outputdata.length && inputdata[0].length == outputdata[0].length) {
                    outputdata.forEach((row, i) => {
                        const tr = document.createElement('tr');
                        const rowHeader = document.createElement('th');
                        rowHeader.textContent = i + 1;
                        rowHeader.style.fontSize = '0.8em';
                        rowHeader.style.color = '#666';
                        rowHeader.style.border = '1px solid #ddd';
                        rowHeader.style.padding = '2px';
                        rowHeader.style.fontFamily = 'monospace';
                        tr.appendChild(rowHeader);
                        row.forEach((_, j) => {
                            const td = document.createElement('td');
                            td.style.border = '1px solid #ddd';
                            const input = document.createElement('input');
                            input.type = 'numeric';
                            input.value = inputdata[i][j];
                            input.style.width = '20px';
                            input.style.textAlign = 'center';
                            input.id = `humantable_${i}_${j}`;
                            if (inputdata[i] && input.value != inputdata[i][j]) {
                                input.style.color = 'blue';
                                input.style.fontWeight = 'bold';
                            } else {
                                input.style.color = 'black';
                                input.style.fontWeight = 'normal';
                            }
                            td.appendChild(input);
                            tr.appendChild(td);
                        });
                        table.appendChild(tr);
                    });
                } else {
                    outputdata.forEach((row, i) => {
                        const tr = document.createElement('tr');
                        const rowHeader = document.createElement('th');
                        rowHeader.textContent = i + 1;
                        rowHeader.style.fontSize = '0.8em';
                        rowHeader.style.color = '#666';
                        rowHeader.style.border = '1px solid #ddd';
                        rowHeader.style.padding = '2px';
                        rowHeader.style.fontFamily = 'monospace';
                        tr.appendChild(rowHeader);
                        row.forEach((_, j) => {
                            const td = document.createElement('td');
                            td.style.border = '1px solid #ddd';
                            const input = document.createElement('input');
                            input.type = 'numeric';
                            input.value = 0;
                            input.style.width = '20px';
                            input.style.textAlign = 'center';
                            input.id = `humantable_${i}_${j}`;
                            td.appendChild(input);
                            tr.appendChild(td);
                        });
                        table.appendChild(tr);
                    });
                }
                container.appendChild(table);
            } else {
                const table = document.createElement('table');
                table.style.borderCollapse = 'collapse';
                table.style.borderSpacing = '0'; 
                table.style.tableLayout = 'fixed'; 
                const rowLength = outputdata[0].length
                for (let colIndex = 0; colIndex < rowLength; colIndex++) {
                    const th = document.createElement('th');
                    th.textContent = colIndex + 1;
                    th.style.fontSize = '0.8em';
                    th.style.color = '#666';
                    th.style.border = '1px solid #ddd';
                    th.style.padding = '2px';
                    th.style.fontFamily = 'monospace';
                    headerRow.appendChild(th);
                }
                table.appendChild(headerRow);
                if (inputdata.length == outputdata.length && inputdata[0].length == outputdata[0].length) {
                    outputdata.forEach((row, i) => {
                        const tr = document.createElement('tr');
                        const rowHeader = document.createElement('th');
                        rowHeader.textContent = i + 1;
                        rowHeader.style.fontSize = '0.8em';
                        rowHeader.style.color = '#666';
                        rowHeader.style.border = '1px solid #ddd';
                        rowHeader.style.padding = '2px';
                        rowHeader.style.fontFamily = 'monospace';
                        tr.appendChild(rowHeader);
                        row.forEach((_, j) => {
                            const td = document.createElement('td');
                            td.style.border = '1px solid #ddd';
                            const input = document.createElement('input');
                            input.type = 'numeric';
                            input.value = human[i][j];
                            input.style.width = '20px';
                            input.style.textAlign = 'center';
                            input.id = `humantable_${i}_${j}`;
                            if (inputdata[i] && input.value != inputdata[i][j]) {
                                input.style.color = 'blue';
                                input.style.fontWeight = 'bold';
                            } else {
                                input.style.color = 'black';
                                input.style.fontWeight = 'normal';
                            }
                            td.appendChild(input);
                            tr.appendChild(td);
                        });
                        table.appendChild(tr);
                    });
                } else {
                    outputdata.forEach((row, i) => {
                        const tr = document.createElement('tr');
                        const rowHeader = document.createElement('th');
                        rowHeader.textContent = i + 1;
                        rowHeader.style.fontSize = '0.8em';
                        rowHeader.style.color = '#666';
                        rowHeader.style.border = '1px solid #ddd';
                        rowHeader.style.padding = '2px';
                        rowHeader.style.fontFamily = 'monospace';
                        tr.appendChild(rowHeader);
                        row.forEach((_, j) => {
                            const td = document.createElement('td');
                            td.style.border = '1px solid #ddd';
                            const input = document.createElement('input');
                            input.type = 'numeric';
                            input.value = human[i][j];
                            input.style.width = '20px';
                            input.style.textAlign = 'center';
                            input.id = `humantable_${i}_${j}`;
                            td.appendChild(input);
                            tr.appendChild(td);
                        });
                        table.appendChild(tr);
                    });
                }
                container.appendChild(table);
            }
        }


        function renderMatrix(container, matrixData) {
            if (!container || !matrixData) {
                console.error('Invalid container or matrix data');
                return;
            }
            container.innerHTML = '';
            if (!Array.isArray(matrixData)) {
                container.textContent = 'Invalid matrix data format';
                return;
            }
            const matrixElement = document.createElement('div');
            matrixElement.className = 'matrix';
            if (Array.isArray(matrixData[0])) {
                const rowLength = matrixData[0].length;
                const isValidMatrix = matrixData.every(row => Array.isArray(row) && row.length === rowLength);
                if (!isValidMatrix) {
                    container.textContent = 'Invalid matrix format: rows have different lengths';
                    return;
                }
                const table = document.createElement('table');
                table.style.borderSpacing = '0'; 
                table.style.borderCollapse = 'collapse';
                table.style.tableLayout = 'fixed'; 
                const maxDigits = Math.max(
                    ...matrixData.flat().map(cell => String(cell).length),
                    ...Array(matrixData[0].length).fill(0).map((_, i) => String(i+1).length),
                    ...Array(matrixData.length).fill(0).map((_, i) => String(i+1).length)
                );
                const columnWidth = Math.max(10, maxDigits * 8);
                const headerRow = document.createElement('tr');
                const cornerCell = document.createElement('th');
                cornerCell.style.border = '1px solid #ddd';
                cornerCell.style.padding = '2px';
                cornerCell.style.width = columnWidth + 'px';
                cornerCell.style.fontFamily = 'monospace';
                headerRow.appendChild(cornerCell);
                for (let colIndex = 0; colIndex < rowLength; colIndex++) {
                    const th = document.createElement('th');
                    th.textContent = colIndex + 1;
                    th.style.fontSize = '0.8em';
                    th.style.color = '#666';
                    th.style.border = '1px solid #ddd';
                    th.style.padding = '2px';
                    th.style.width = columnWidth + 'px';
                    th.style.fontFamily = 'monospace';
                    headerRow.appendChild(th);
                }
                table.appendChild(headerRow);
                matrixData.forEach((row, rowIndex) => {
                    const tr = document.createElement('tr');
                    const rowHeader = document.createElement('th');
                    rowHeader.textContent = rowIndex + 1;
                    rowHeader.style.fontSize = '0.8em';
                    rowHeader.style.color = '#666';
                    rowHeader.style.border = '1px solid #ddd';
                    rowHeader.style.padding = '2px';
                    rowHeader.style.width = columnWidth + 'px';
                    rowHeader.style.fontFamily = 'monospace';
                    tr.appendChild(rowHeader);
                    row.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell;
                        td.style.border = '1px solid #ddd';
                        td.style.padding = '2px';
                        td.style.width = columnWidth + 'px';
                        td.style.fontFamily = 'monospace';
                        tr.appendChild(td);
                    });
                    table.appendChild(tr);
                });
                matrixElement.appendChild(table);
            } else {
                matrixElement.textContent = matrixData.join(', ');
            }
            container.appendChild(matrixElement);
        }
    </script>
</body>
</html>
